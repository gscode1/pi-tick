name: merge-ready

# Squash-merges a pull request when gscode1, or the Renovate review agent after a PASS, adds the merge-ready label.
# pull_request_target runs this file from main and never checks out the PR's code.
on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: merge-ready-${{ github.event.pull_request.number }}

jobs:
  merge:
    # gscode1 may label any same-repo PR. The review agent (GitHub App gskode-onecli) may label only Renovate PRs:
    # opened by gscode1 from a renovate/ branch and labeled renovate. Every cela session shares that App identity.
    if: >-
      github.event.label.name == 'merge-ready' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.sender.login == 'gscode1' ||
       (github.event.sender.login == 'gskode-onecli[bot]' &&
        github.event.pull_request.user.login == 'gscode1' &&
        startsWith(github.event.pull_request.head.ref, 'renovate/') &&
        contains(github.event.pull_request.labels.*.name, 'renovate')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # --auto: merges once the required check (audit) passes; branch protection on main requires it.
      # --match-head-commit: a commit pushed after the label was added is not merged.
      - name: Merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR" --auto --squash --match-head-commit "$SHA"
